name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: codeforge
          POSTGRES_DB: codeforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn docker redis "psycopg[binary]" requests prometheus-client pydantic

      - name: Check all modules import
        run: |
          python -c "import models, config, ratelimit, languages, metrics; print('imports ok')"

      - name: Test rate limiter logic
        run: |
          python -c "from ratelimit import TokenBucket; b = TokenBucket(3, 1); assert [b.allow() for _ in range(5)] == [True, True, True, False, False]; print('rate limiter ok')"

      - name: Initialize database schema
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: |
          python init_db.py
          python init_keys.py